# Vérification des types de Track B (DS5).
# Depuis la racine du dépôt :
#   python -m mypy --config-file src/track_b_accounting/mypy.ini

[mypy]
python_version = 3.11
files = src/track_b_accounting
mypy_path = src, src/track_b_accounting/tests, src/track_b_accounting/tools
explicit_package_bases = True
warn_unused_ignores = True

# Bibliothèques sans annotations de types publiées.
[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-pymupdf.*,fitz.*]
ignore_missing_imports = True
